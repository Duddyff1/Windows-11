<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Dragon Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-2018">
    <div id="app">
        <header>
            <h1>Dragon Simulator</h1>
            <div id="stats">
                <span>Robux: <strong id="robux-display">500</strong></span>
                <span>Coins: <strong id="coins-display">50</strong></span>
            </div>
        </header>

        <main>
            <div class="combat-section">
                <h2>Wild Dragon</h2>
                <div class="hp-bar-container">
                    <div id="dragon-hp" style="width: 100%;"></div>
                </div>
                <button onclick="attackDragon()">Attack Dragon</button>
            </div>

            <div class="shop-section">
                <h2>Shop</h2>
                <button onclick="buyItem('Dragon Slayer Sword', 50)">Buy Sword (50 Robux)</button>
                <button onclick="buyItem('Dominus Empyreus', 100)">Buy Dominus (100 Robux)</button>
            </div>

            <div class="inventory-section">
                <h2>Inventory</h2>
                <ul id="inventory-list"></ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
