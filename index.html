<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Roleplay OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="desktop-icon" onclick="openApp('notepad')">
            📝<span>Notepad</span>
        </div>
        <div class="desktop-icon" onclick="openApp('calculator')">
            🧮<span>Calculator</span>
        </div>

        <!-- App Windows (Hidden by default) -->
        <div id="notepad" class="window hidden">
            <div class="window-header">
                <span>Notepad</span>
                <button onclick="closeApp('notepad')">X</button>
            </div>
            <textarea placeholder="Type your roleplay notes here..."></textarea>
        </div>

        <div id="calculator" class="window hidden">
            <div class="window-header">
                <span>Calculator</span>
                <button onclick="closeApp('calculator')">X</button>
            </div>
            <div class="calc-body">
                <input type="text" id="calc-display" disabled>
                <button onclick="alert('Roleplay calc clicked!')">Calculate</button>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-icon start-button">⊞</div>
        <div class="taskbar-icon" onclick="openApp('notepad')">📝</div>
        <div class="taskbar-icon" onclick="openApp('calculator')">🧮</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
